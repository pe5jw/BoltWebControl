<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BoltAudioBridge — Test</title>
<style>
  body { font-family: monospace; background: #1a1a2e; color: #e0e0e0; padding: 2rem; }
  h1 { color: #00d4ff; }
  select, button { background: #16213e; color: #e0e0e0; border: 1px solid #00d4ff;
                   padding: .4rem .8rem; margin: .3rem 0; cursor: pointer; }
  button:hover { background: #00d4ff; color: #1a1a2e; }
  #status { margin-top: 1rem; color: #aaa; }
  .ok { color: #00ff88; }
  .err { color: #ff4466; }
</style>
</head>
<body>
<h1>🎙 BoltAudioBridge — Audio Test</h1>

<h3>Browser audio input</h3>
<select id="browserInput"><option>Laden...</option></select>

<h3>Server audio devices</h3>
<div>Input (radio RX → browser): <select id="serverInput"><option>Laden...</option></select></div>
<div>Output (browser mic → radio TX): <select id="serverOutput"><option>Laden...</option></select></div>

<br>
<button id="btnConnect">Verbinden</button>
<button id="btnDisconnect" disabled>Verbreken</button>

<div id="status">Gereed.</div>

<script src="/lib/signalr/dist/browser/signalr.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
