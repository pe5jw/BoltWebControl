<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BoltWebControl</title>
<style>
  :root {
    --bg:      #0d0d0d;
    --surface: #191919;
    --surface2:#222;
    --border:  #2e2e2e;
    --accent:  #00aaff;
    --danger:  #ff3333;
    --ok:      #22cc66;
    --warn:    #ffaa00;
    --text:    #e0e0e0;
    --muted:   #666;
    --radius:  10px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100dvh;display:flex;flex-direction:column}

  /* ── Header ── */
  header{background:var(--surface);border-bottom:1px solid var(--border);padding:.5rem 1rem;display:flex;align-items:center;gap:.6rem;flex-shrink:0}
  header h1{font-size:.95rem;font-weight:700;letter-spacing:.06em;color:var(--accent)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex-shrink:0;transition:background .3s}
  .dot.ok{background:var(--ok)} .dot.err{background:var(--danger)} .dot.warn{background:var(--warn)}
  .st{display:flex;align-items:center;gap:.35rem;font-size:.75rem;color:var(--muted)}
  .st+.st{margin-left:.7rem;padding-left:.7rem;border-left:1px solid var(--border)}
  .spacer{flex:1}
  #settings-btn{background:none;border:1px solid var(--border);color:var(--muted);border-radius:5px;padding:.3rem .65rem;cursor:pointer;font-size:.8rem;transition:border-color .15s,color .15s}
  #settings-btn:hover{border-color:var(--accent);color:var(--accent)}

  /* ── Settings drawer ── */
  #settings-drawer{
    background:var(--surface);border-bottom:2px solid var(--accent);
    padding:1rem 1.2rem;display:none;flex-wrap:wrap;gap:.8rem;align-items:flex-end
  }
  #settings-drawer.open{display:flex}
  .field{display:flex;flex-direction:column;gap:.3rem}
  .field label{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
  .field input,.field select{
    background:var(--surface2);border:1px solid var(--border);border-radius:5px;
    color:var(--text);padding:.4rem .6rem;font-size:.88rem;outline:none;min-width:140px
  }
  .field input:focus,.field select:focus{border-color:var(--accent)}
  .field select option{background:var(--surface2)}
  #save-btn{
    padding:.42rem 1rem;background:var(--accent);color:#000;font-weight:700;
    border:none;border-radius:5px;cursor:pointer;font-size:.88rem;white-space:nowrap
  }
  #save-btn:hover{opacity:.85}
  #save-msg{font-size:.78rem;color:var(--ok);display:none}

  /* ── Main grid ── */
  main{
    flex:1;display:grid;
    grid-template-columns:1fr 1fr;
    gap:1px;background:var(--border);
    max-width:900px;width:100%;margin:0 auto;
    border-left:1px solid var(--border);border-right:1px solid var(--border)
  }

  .panel{background:var(--surface);padding:1.1rem 1.3rem}
  .panel.span2{grid-column:1/-1}
  .panel-label{font-size:.62rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:.7rem}

  /* ── VFO ── */
  #freq-display{font-size:3.4rem;font-variant-numeric:tabular-nums;letter-spacing:.04em;color:var(--accent);cursor:pointer;user-select:none;line-height:1;padding:.2rem 0}
  #freq-display:hover{opacity:.82}
  .fsep{color:var(--muted);margin:0 .04em}
  #freq-unit{font-size:1rem;color:var(--muted);margin-left:.35rem;vertical-align:middle}
  #freq-input{display:none;font-size:2rem;width:100%;background:var(--surface2);border:1px solid var(--accent);border-radius:6px;color:var(--accent);padding:.35rem .55rem;font-variant-numeric:tabular-nums;outline:none}
  .freq-hint{font-size:.7rem;color:var(--muted);margin-top:.3rem;display:none}

  /* ── Mode ── */
  .mode-grid{display:flex;flex-wrap:wrap;gap:.35rem}
  .mode-btn{padding:.4rem .9rem;border-radius:5px;border:1px solid var(--border);background:var(--surface2);color:var(--text);cursor:pointer;font-size:.82rem;transition:background .1s,border-color .1s,color .1s}
  .mode-btn:hover{border-color:var(--accent);color:var(--accent)}
  .mode-btn.active{background:var(--accent);color:#000;border-color:var(--accent);font-weight:700}

  /* ── S-meter ── */
  #smeter-track{display:flex;gap:4px;height:36px;align-items:flex-end}
  .seg{flex:1;border-radius:3px 3px 0 0;background:var(--border);transition:background .15s}
  .seg:nth-child(1){height:28%} .seg:nth-child(2){height:37%} .seg:nth-child(3){height:47%}
  .seg:nth-child(4){height:54%} .seg:nth-child(5){height:63%} .seg:nth-child(6){height:72%}
  .seg:nth-child(7){height:81%} .seg:nth-child(8){height:90%} .seg:nth-child(9){height:100%}
  .seg.l1,.seg.l2,.seg.l3{background:var(--ok)}
  .seg.l4,.seg.l5,.seg.l6{background:#aacc00}
  .seg.l7,.seg.l8{background:var(--warn)}
  .seg.l9{background:var(--danger)}
  #smeter-labels{display:flex;justify-content:space-between;font-size:.58rem;color:var(--muted);margin-top:.2rem;padding:0 2px}
  #smeter-val{font-size:.82rem;color:var(--text);margin-top:.4rem}

  /* ── PTT ── */
  #ptt-btn{width:100%;padding:1rem;font-size:1.05rem;font-weight:800;border:2px solid var(--border);border-radius:var(--radius);cursor:pointer;letter-spacing:.15em;background:var(--surface2);color:var(--muted);transition:all .1s}
  #ptt-btn.rdy{border-color:var(--ok);color:var(--ok)}
  #ptt-btn.tx{background:var(--danger);color:#fff;border-color:var(--danger);box-shadow:0 0 20px rgba(255,51,51,.3)}

  /* ── Footer ── */
  #foot{grid-column:1/-1;background:var(--bg);border-top:1px solid var(--border);padding:.35rem 1.2rem;display:flex;gap:1rem;font-size:.68rem;color:var(--muted)}
  #foot .r{margin-left:auto}

  @media(max-width:540px){
    main{grid-template-columns:1fr}
    .panel.span2,.panel{grid-column:1}
    #freq-display{font-size:2.4rem}
  }
</style>
</head>
<body>

<!-- Header -->
<header>
  <span style="font-size:1.1rem">⚡</span>
  <h1>BoltWebControl</h1>
  <div class="spacer"></div>
  <div class="st"><div class="dot" id="hub-dot"></div><span id="hub-lbl">SignalR…</span></div>
  <div class="st"><div class="dot" id="rig-dot"></div><span id="rig-lbl">rigctld…</span></div>
  <button id="settings-btn" onclick="toggleSettings()">⚙ Instellingen</button>
</header>

<!-- Settings drawer -->
<div id="settings-drawer">
  <div class="field">
    <label>rigctld host</label>
    <input id="s-host" type="text" placeholder="localhost" value="localhost">
  </div>
  <div class="field">
    <label>Poort</label>
    <input id="s-port" type="number" min="1" max="65535" placeholder="4532" value="4532" style="min-width:90px">
  </div>
  <div class="field">
    <label>Rig model</label>
    <select id="s-rig"><option value="Auto">— laden… —</option></select>
  </div>
  <button id="save-btn" onclick="saveSettings()">Opslaan</button>
  <span id="save-msg">✓ Opgeslagen</span>
</div>

<!-- Main -->
<main>
  <!-- VFO A -->
  <div class="panel span2">
    <div class="panel-label">VFO A</div>
    <div id="freq-display">
      <span id="f-mhz">14</span><span class="fsep">.</span><span id="f-khz">225</span><span class="fsep">.</span><span id="f-hz">000</span><span id="freq-unit">MHz</span>
    </div>
    <input id="freq-input" type="number" placeholder="Freq in Hz (bijv. 14225000)" min="1000" max="2000000000" step="1">
    <div class="freq-hint" id="freq-hint">Enter = bevestigen &nbsp;·&nbsp; Esc = annuleren</div>
  </div>

  <!-- Mode -->
  <div class="panel">
    <div class="panel-label">Mode</div>
    <div class="mode-grid">
      <button class="mode-btn" data-mode="USB">USB</button>
      <button class="mode-btn" data-mode="LSB">LSB</button>
      <button class="mode-btn" data-mode="AM">AM</button>
      <button class="mode-btn" data-mode="FM">FM</button>
      <button class="mode-btn" data-mode="CW">CW</button>
      <button class="mode-btn" data-mode="CWR">CW-R</button>
      <button class="mode-btn" data-mode="RTTY">RTTY</button>
      <button class="mode-btn" data-mode="RTTYR">RTTY-R</button>
      <button class="mode-btn" data-mode="PKTUSB">FT8/DATA</button>
      <button class="mode-btn" data-mode="PKTLSB">PSK</button>
    </div>
  </div>

  <!-- S-meter -->
  <div class="panel">
    <div class="panel-label">S-meter</div>
    <div id="smeter-track">
      <div class="seg" data-s="1"></div><div class="seg" data-s="2"></div>
      <div class="seg" data-s="3"></div><div class="seg" data-s="4"></div>
      <div class="seg" data-s="5"></div><div class="seg" data-s="6"></div>
      <div class="seg" data-s="7"></div><div class="seg" data-s="8"></div>
      <div class="seg" data-s="9"></div>
    </div>
    <div id="smeter-labels"><span>S1</span><span>S3</span><span>S5</span><span>S7</span><span>S9</span></div>
    <div id="smeter-val">S0 · geen signaal</div>
  </div>

  <!-- PTT -->
  <div class="panel">
    <div class="panel-label">Zenden</div>
    <button id="ptt-btn">RX</button>
  </div>

  <!-- Footer -->
  <div id="foot">
    <span>PE5JW</span>
    <span id="ts">—</span>
    <span class="r">BoltWebControl v0.1</span>
  </div>
</main>

<script src="/hubs/signalr.min.js"></script>
<script>
// ── Status helpers ────────────────────────────────────────────────────────
const hubDot = document.getElementById('hub-dot');
const hubLbl = document.getElementById('hub-lbl');
const rigDot = document.getElementById('rig-dot');
const rigLbl = document.getElementById('rig-lbl');
let rigConnected = false;

function setHub(ok, txt) { hubDot.className='dot '+(ok?'ok':'err'); hubLbl.textContent=txt; }
function setRig(ok, txt) {
  rigConnected = ok;
  rigDot.className = 'dot '+(ok?'ok':'err');
  rigLbl.textContent = txt ?? (ok ? 'rigctld verbonden' : 'rigctld: offline');
  const ptt = document.getElementById('ptt-btn');
  if (!ptt.classList.contains('tx')) ptt.className = ok ? 'rdy' : '';
}

// ── SignalR ───────────────────────────────────────────────────────────────
const conn = new signalR.HubConnectionBuilder()
  .withUrl('/hubs/rig')
  .withAutomaticReconnect([500,1000,2000,5000])
  .build();

conn.on('RigUpdate',  s   => { setRig(true); updateUI(s); });
conn.on('RigOffline', msg => setRig(false, 'rigctld: '+msg));

conn.onreconnecting(() => setHub(false,'Herverbinden…'));
conn.onreconnected(()  => setHub(true, 'Verbonden'));
conn.onclose(()        => setHub(false,'Verbroken'));

(async () => {
  try {
    await conn.start();
    setHub(true, 'Verbonden');
    // Direct status ophalen
    try {
      const r = await fetch('/api/status');
      if (r.ok) { updateUI(await r.json()); setRig(true); }
      else       setRig(false, 'rigctld: niet bereikbaar');
    } catch { setRig(false, 'rigctld: niet bereikbaar'); }
    loadSettings();
  } catch(e) {
    setHub(false, 'Fout: '+e.message);
  }
})();

// ── UI updaten ────────────────────────────────────────────────────────────
function updateUI(s) {
  setFreqDisplay(s.frequencyHz);
  setMode(s.mode);
  setSMeter(s.sMeter);
  setPtt(s.ptt);
  document.getElementById('ts').textContent =
    'Bijgewerkt: ' + new Date().toLocaleTimeString('nl-NL');
}

function setFreqDisplay(hz) {
  document.getElementById('f-mhz').textContent = String(Math.floor(hz/1e6)).padStart(2,'0');
  document.getElementById('f-khz').textContent = String(Math.floor((hz%1e6)/1e3)).padStart(3,'0');
  document.getElementById('f-hz').textContent  = String(hz%1e3).padStart(3,'0');
}

function setMode(mode) {
  const m = (mode||'').trim().toUpperCase();
  document.querySelectorAll('.mode-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.mode === m));
}

function setSMeter(s) {
  const v = Math.max(0, Math.min(9, s|0));
  document.querySelectorAll('.seg').forEach(seg => {
    const n = +seg.dataset.s;
    seg.className = 'seg' + (n <= v ? ` l${n}` : '');
  });
  document.getElementById('smeter-val').textContent =
    v===0 ? 'S0 · geen signaal' : v===9 ? 'S9 · sterk signaal' : `S${v}`;
}

function setPtt(on) {
  const btn = document.getElementById('ptt-btn');
  if (on) { btn.textContent='TX — ZENDEN'; btn.className='tx'; }
  else     { btn.textContent='RX'; btn.className = rigConnected?'rdy':''; }
}

// ── Frequentie invoer ─────────────────────────────────────────────────────
const freqDisp  = document.getElementById('freq-display');
const freqInput = document.getElementById('freq-input');
const freqHint  = document.getElementById('freq-hint');

freqDisp.addEventListener('click', () => {
  freqDisp.style.display='none'; freqInput.style.display='block'; freqHint.style.display='block';
  freqInput.focus();
});
freqInput.addEventListener('keydown', async e => {
  if (e.key==='Enter') { const hz=parseInt(freqInput.value); if(hz>=1000) await hub('SetFreq',hz); hideFreq(); }
  else if (e.key==='Escape') hideFreq();
});
freqInput.addEventListener('blur', hideFreq);
function hideFreq(){ freqInput.style.display='none'; freqHint.style.display='none'; freqDisp.style.display=''; }

// ── Mode ──────────────────────────────────────────────────────────────────
document.querySelectorAll('.mode-btn').forEach(b =>
  b.addEventListener('click', () => hub('SetMode', b.dataset.mode)));

// ── PTT ───────────────────────────────────────────────────────────────────
let pttState = false;
document.getElementById('ptt-btn').addEventListener('click', async () => {
  pttState = !pttState;
  try { await hub('SetPtt', pttState); } catch { pttState=!pttState; }
});

async function hub(method, ...args) {
  try { await conn.invoke(method, ...args); } catch(e) { console.warn(method, e.message); }
}

// ── Settings ─────────────────────────────────────────────────────────────
function toggleSettings() {
  const d = document.getElementById('settings-drawer');
  d.classList.toggle('open');
}

async function loadSettings() {
  try {
    const r = await fetch('/api/settings');
    if (!r.ok) return;
    const s = await r.json();

    document.getElementById('s-host').value = s.host;
    document.getElementById('s-port').value = s.port;

    // Vul rig dropdown
    const sel = document.getElementById('s-rig');
    sel.innerHTML = '<option value="Auto">Auto (rigctld bepaalt)</option>';
    (s.knownRigs || []).forEach(r => {
      const opt = document.createElement('option');
      opt.value = r.model;
      opt.textContent = `${r.model} — ${r.name}`;
      if (r.name === s.rig || String(r.model) === s.rig) opt.selected = true;
      sel.appendChild(opt);
    });
    if (s.rig === 'Auto') sel.value = 'Auto';
  } catch(e) { console.warn('loadSettings:', e); }
}

async function saveSettings() {
  const host = document.getElementById('s-host').value.trim();
  const port = parseInt(document.getElementById('s-port').value) || 4532;
  const rig  = document.getElementById('s-rig').value;

  try {
    const r = await fetch('/api/settings', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ host, port, rig })
    });
    if (r.ok) {
      const msg = document.getElementById('save-msg');
      msg.style.display = 'inline';
      setTimeout(() => msg.style.display='none', 2500);
      setRig(false, 'rigctld: herverbinden…');
    }
  } catch(e) { console.error('saveSettings:', e); }
}
</script>
</body>
</html>
